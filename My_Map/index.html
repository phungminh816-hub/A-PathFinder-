<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A* Map Pathfinder</title>
  <meta name="description" content="Tìm đường trên dữ liệu OpenStreetMap cục bộ bằng Bidirectional A*.">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <div id="map" aria-label="Bản đồ tìm đường"></div>

    <section class="control-panel" aria-label="Điều khiển tìm đường">
      <h1>Tìm đường A*</h1>

      <div class="search-field">
        <label for="startSearch">Điểm bắt đầu</label>
        <div class="input-row">
          <input id="startSearch" type="search" placeholder="Nhập địa chỉ hoặc bấm trên bản đồ" autocomplete="off">
          <button id="clearStart" class="icon-button" type="button" title="Xóa điểm bắt đầu">×</button>
        </div>
        <div id="startSuggestions" class="suggestions hidden"></div>
      </div>

      <div class="search-field">
        <label for="endSearch">Điểm kết thúc</label>
        <div class="input-row">
          <input id="endSearch" type="search" placeholder="Nhập địa chỉ hoặc bấm trên bản đồ" autocomplete="off">
          <button id="clearEnd" class="icon-button" type="button" title="Xóa điểm kết thúc">×</button>
        </div>
        <div id="endSuggestions" class="suggestions hidden"></div>
      </div>

      <div class="options-grid">
        <label>
          Tiêu chí
          <select id="routingPreference">
            <option value="shortest">Ngắn nhất</option>
            <option value="traffic">Theo trọng số giao thông</option>
            <option value="railway">Chỉ đường sắt</option>
          </select>
        </label>
        <label>
          Hiển thị thuật toán
          <select id="searchSpeed">
            <option value="instant">Tức thời</option>
            <option value="animated-fast" selected>Nhanh</option>
            <option value="animated-slow">Từng bước</option>
          </select>
        </label>
      </div>

      <label class="check-row">
        <input id="toggleGraph" type="checkbox" checked>
        Hiện đồ thị đường đi
      </label>

      <div class="button-row">
        <button id="findRouteBtn" class="primary" type="button" disabled>Tìm đường</button>
        <button id="clearAllBtn" type="button">Đặt lại</button>
      </div>

      <div id="statusBox" class="status info">
        <span id="statusSpinner" class="spinner hidden" aria-hidden="true"></span>
        <span id="statusIndicator" class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Đang khởi tạo...</span>
      </div>

      <dl id="statsSection" class="stats hidden">
        <div><dt>Quãng đường</dt><dd id="statDistance">0 km</dd></div>
        <div><dt>Thời gian ước tính</dt><dd id="statTime">0 phút</dd></div>
        <div><dt>Số đỉnh đồ thị</dt><dd id="statNodes">0</dd></div>
        <div><dt>Số đỉnh đã duyệt</dt><dd id="statVisited">0</dd></div>
      </dl>

      <div class="legend" aria-label="Chú thích">
        <span><i class="normal"></i>Đường thường</span>
        <span><i class="medium"></i>Trọng số 2.5×</span>
        <span><i class="heavy"></i>Trọng số 5×</span>
        <span><i class="route"></i>Kết quả</span>
      </div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
